<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Sleek rounded dark squircle -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#1e293b" stroke-width="1"/>
  <!-- Developer code bracket < -->
  <path d="M10 11 L5.5 16 L10 21" fill="none" stroke="url(#cyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code slash / -->
  <line x1="18" y1="9" x2="14" y2="23" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Developer code bracket > -->
  <path d="M22 11 L26.5 16 L22 21" fill="none" stroke="url(#cyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
